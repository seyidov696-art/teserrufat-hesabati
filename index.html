:root{
  --bg:#F7F5EE; --card:#FFFFFF; --line:#E2DED2; --line2:#EFEBE0; --ink:#1F2A1C; --muted:#5B6357; --muted2:#3F473B;
  --green:#2E6B3A; --green-d:#1F4D29; --green-l:#E3F0E6; --red:#A23B32; --red-l:#FBE7E4; --warn:#FFF4D6; --warn-b:#E9CF83; --warn-t:#5C3D00;
  --blue:#2F5D8A; --teal:#1F6F6B; --brown:#8A5A2B; --orange:#B5541C; --purple:#6A4C93; --slate:#33475B; --olive:#5E6B1F; --nut:#7A4E1D; --cyan:#0F6E8C; --grey:#5A5A5A;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter Variable",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
a{color:var(--green);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
button{cursor:pointer}
.hidden{display:none !important}

/* layout */
.app{display:flex;min-height:100vh}
.side{width:240px;flex:0 0 240px;background:var(--card);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand-ic{width:40px;height:40px;border-radius:12px;background:var(--green);display:flex;align-items:center;justify-content:center}
.brand b{font-size:17px}
.nav{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:10px;color:var(--ink);font-size:15px;border:0;background:none;text-align:left;width:100%}
.nav:hover{background:#F2EFE6}
.nav.on{background:var(--green-l);color:var(--green-d);font-weight:700}
.nav .dot{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.side .sp{flex:1}
.main{flex:1;min-width:0;padding:26px 32px 60px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.top h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.4px}
.top .sub{font-size:14px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.pad{padding:16px 18px}
.card h3{margin:0;font-size:17px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.stat .l{font-size:14px;color:var(--muted)}
.stat .v{font-size:25px;font-weight:800;margin-top:6px}
.stat.dark{background:var(--green);border-color:var(--green);color:#fff}
.stat.dark .l{color:#fff}
.pos{color:var(--green)} .neg{color:var(--red)}
.alert{background:var(--warn);border:1px solid var(--warn-b);border-radius:14px;padding:11px 16px;color:var(--warn-t);font-size:15px}
.ok-msg{background:var(--green-l);border:1px solid #BFDCC6;border-radius:14px;padding:11px 16px;color:var(--green-d)}
.empty{padding:26px 18px;color:var(--muted);text-align:center}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;background:#EDE9DD;color:var(--muted2);white-space:nowrap}
.tag.own{background:var(--green-l);color:var(--green-d)}
.tag.rent{background:#FDEBDD;color:#8A3D0E}
.tag.debt{background:var(--red-l);color:#7E2A22}
.tag.paid{background:var(--green-l);color:var(--green-d)}

/* home tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:18px 12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;padding:6px;border-radius:14px}
.tile:hover{background:#EFEBE0}
.tile .ic{width:66px;height:66px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.tile span{font-size:14px;font-weight:600}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;color:var(--muted);font-weight:600;padding:10px 14px;white-space:nowrap;border-bottom:1px solid var(--line2)}
td{padding:10px 14px;border-top:1px solid var(--line2);vertical-align:middle}
tr:first-child td{border-top:0}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:800;border-top:2px solid var(--line)}
.acts{white-space:nowrap;text-align:right}

/* buttons */
.btn{height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--ink);background:#fff;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#F2EFE6}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.pri:hover{background:var(--green-d)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.sm{height:34px;padding:0 10px;font-size:13.5px;border-radius:9px}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:#EFEBE0}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:#F2EFE6}
.seg{display:inline-flex;background:#EDE9DD;border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{height:36px;border:0;border-radius:9px;background:transparent;padding:0 14px;color:var(--muted2)}
.seg button.on{background:#fff;font-weight:700;color:var(--ink)}

/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:13.5px;font-weight:600;color:var(--muted2)}
.fld input,.fld select,.fld textarea{height:44px;padding:0 12px;border:1px solid #CFCABB;border-radius:11px;background:#fff;width:100%}
.fld textarea{height:70px;padding:10px 12px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--green);outline-offset:0;border-color:var(--green)}
.fld .hint{font-size:12.5px;color:var(--muted)}
.chk{display:flex;align-items:center;gap:8px;font-size:14.5px}
.chk input{width:18px;height:18px}
.err{color:var(--red);font-size:14px;min-height:18px}
.calc{background:#F7F5EE;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.calc b{font-size:20px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(20,28,18,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:18px;width:100%;max-width:620px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line2)}
.modal .mh h2{margin:0;font-size:19px}
.modal .mb{padding:18px 20px}
.modal .mf{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line2)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:60;font-size:14.5px}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .box{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px}
.login .logo{width:84px;height:84px;border-radius:24px;background:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto}
.login h1{margin:0;text-align:center;font-size:27px}
.login p{margin:0;text-align:center;color:var(--muted)}

/* bars */
.bars{display:flex;gap:18px;align-items:flex-end;height:190px;padding:10px 6px 0;border-bottom:1px solid #D9D4C6;overflow-x:auto}
.bar-g{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:70px}
.bar-p{display:flex;gap:5px;align-items:flex-end;height:160px}
.bar{width:24px;border-radius:6px 6px 0 0}
.bar-l{font-size:12.5px;color:var(--muted2);text-align:center;padding-top:6px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.prog{height:9px;border-radius:5px;background:#EDE9DD;display:flex;overflow:hidden}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:14.5px}
.kv span{color:var(--muted)}
.pinfo .kv{gap:8px;justify-content:flex-start}
.bnav{display:none}
.inst{display:flex;align-items:center;gap:12px;background:var(--green-l);border:1px solid #BFD9C5;border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:14px;line-height:1.35}
.inst .ic{font-size:26px}.inst>div{flex:1}.inst div div{color:var(--muted)}
.inst .x{border:0;background:none;font-size:18px;color:var(--muted);padding:4px 6px;cursor:pointer}
.more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
.more-grid button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600;text-align:center;color:var(--ink);cursor:pointer;padding:4px}
.more-grid .ic{width:56px;height:56px;border-radius:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.steps{display:flex;flex-direction:column;gap:14px;font-size:15px;line-height:1.45}
.steps .st{display:flex;gap:12px;align-items:flex-start}.steps .st>span{flex:0 0 28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.steps .kbd{display:inline-block;padding:0 4px}.warn-p{background:var(--warn);border:1px solid var(--warn-b);color:var(--warn-t);border-radius:10px;padding:10px 12px;margin:0}
@media (max-width: 860px){
  .side{position:sticky;top:0;z-index:20;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-right:0;border-bottom:1px solid var(--line);box-shadow:0 1px 6px rgba(0,0,0,.04)}
  .side .nav{display:none !important}
  .side .brand{margin:0}
  .main{padding:16px 12px calc(84px + env(safe-area-inset-bottom))}
  .top h1{font-size:24px}
  .btn{min-height:44px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;cursor:pointer}
  .bnav button.on{color:var(--green)}
}
@media print{.bnav,.inst{display:none !important}}
.fbar{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:36px;padding:0 14px;border-radius:999px;border:1px solid #CFCABB;background:#fff;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.cloud-st{white-space:nowrap;align-self:center}
@media (max-width: 860px){
  .side{flex-wrap:nowrap;align-items:center}
  .side .brand{padding:0;width:auto;flex:1;min-width:0}
  .side .brand b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fbar select{flex:1 1 45%}
  .grid.g4{grid-template-columns:1fr 1fr}
  .grid.g4 .stat .v{font-size:20px}
}


.cloud-st{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer;margin:2px 0 10px 4px;align-self:flex-start}
@media (max-width: 860px){
  .side{padding:10px 12px;gap:6px;align-items:center}
  .side .nav{display:none}
  .side .nav[data-p="home"],.side .nav[data-a="logout"]{display:flex}
  .side .sp{display:none}
  .side .brand{width:auto;flex:1}
  .cloud-st{margin:0}
}

.print-only{display:none}

@media (max-width: 860px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;flex:none}
  .side .brand{width:100%}
  .nav{width:auto}
  .main{padding:18px 14px 60px}
  .form{grid-template-columns:1fr}
}
@media print{
  .side,.no-print,.btn,.seg,.icon-btn,.toast{display:none !important}
  .main{padding:0}
  .print-only{display:block}
  body{background:#fff}
  .card{break-inside:avoid;border-color:#bbb}
}

<script>

'use strict';

/* ====== Təsərrüfat hesabatı — əsas hissə ====== */
const KEY = 'tsh_data_v1';
const SESSION_KEY = 'tsh_session_v1';
let DB = null;
const VIEW = { page: 'home', p: {} };

const MODULES = [
  { id: 'taxil', name: 'Taxılçılıq' },
  { id: 'ferma', name: 'Ferma' },
  { id: 'findiq', name: 'Fındıq' },
  { id: 'derman', name: 'Dərman satışı' },
  { id: 'material', name: 'Material / ehtiyat' }
];
const modName = id => (MODULES.find(m => m.id === id) || { name: id || '—' }).name;
const PAYTYPES = { nagd: 'Nağd', kocurme: 'Köçürmə', nisye: 'Nisyə' };

/* ---------- köməkçilər ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function todayStr() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function num(v) { if (v == null || v === '') return 0; const n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : 0; }
function r2(n) { n = +n || 0; return Math.sign(n) * Math.round((Math.abs(n) + 1e-9) * 100) / 100; }
function fmtN(n, dec) {
  n = r2(+n || 0);
  const neg = n < 0; n = Math.abs(n);
  let [i, f] = (dec != null ? n.toFixed(dec) : String(n)).split('.');
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  if (f && dec == null) f = f.slice(0, 2);
  return (neg ? '−' : '') + i + (f && +f !== 0 ? ',' + f : '');
}
const fmt = n => fmtN(n) + ' ₼';
const fmtQ = (n, u) => fmtN(n) + ' ' + (u || '');
function fmtD(s) { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}.${m}.${y}`; }
const MONTHS = ['Yanvar', 'Fevral', 'Mart', 'Aprel', 'May', 'İyun', 'İyul', 'Avqust', 'Sentyabr', 'Oktyabr', 'Noyabr', 'Dekabr'];
function monthLabel(d) { const x = d ? new Date(d) : new Date(); return MONTHS[x.getMonth()] + ' ' + x.getFullYear(); }

/* ---------- SHA-256 (şifrə üçün, internetsiz) ---------- */
function sha256(str) {
  const rr = (v, a) => (v >>> a) | (v << (32 - a));
  const msg = new TextEncoder().encode(str);
  const K = [], H = []; let n = 2, c = 0;
  while (c < 64) {
    let p = true; for (let f = 2; f * f <= n; f++) if (n % f === 0) { p = false; break; }
    if (p) { if (c < 8) H[c] = (Math.pow(n, 0.5) * 4294967296) | 0; K[c] = (Math.pow(n, 1 / 3) * 4294967296) | 0; c++; }
    n++;
  }
  const l = msg.length, bitLen = l * 8;
  const buf = new Uint8Array(((l + 9 + 63) >> 6) << 6); buf.set(msg); buf[l] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(buf.length - 4, bitLen >>> 0); dv.setUint32(buf.length - 8, Math.floor(bitLen / 4294967296));
  const W = new Array(64); let h = H.slice();
  for (let i = 0; i < buf.length; i += 64) {
    for (let t = 0; t < 16; t++) W[t] = dv.getUint32(i + t * 4) | 0;
    for (let t = 16; t < 64; t++) {
      const w15 = W[t - 15], w2 = W[t - 2];
      const s0 = rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3), s1 = rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10);
      W[t] = (W[t - 16] + s0 + W[t - 7] + s1) | 0;
    }
    let [a, b, c2, d, e, f, g, hh] = h;
    for (let t = 0; t < 64; t++) {
      const S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25), ch = (e & f) ^ (~e & g), t1 = (hh + S1 + ch + K[t] + W[t]) | 0;
      const S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22), mj = (a & b) ^ (a & c2) ^ (b & c2), t2 = (S0 + mj) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0; d = c2; c2 = b; b = a; a = (t1 + t2) | 0;
    }
    h = [(h[0] + a) | 0, (h[1] + b) | 0, (h[2] + c2) | 0, (h[3] + d) | 0, (h[4] + e) | 0, (h[5] + f) | 0, (h[6] + g) | 0, (h[7] + hh) | 0];
  }
  return h.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}
function hashPw(pw, salt) { let h = salt + '|' + pw; for (let i = 0; i < 3000; i++) h = sha256(h + salt); return h; }

/* ---------- məlumat ---------- */
function defaults() {
  return {
    v: 1, auth: null, farmName: '',
    settings: {
      expenseCats: ['Toxum', 'Gübrə', 'Dərman (pestisid)', 'Yanacaq', 'Təmir', 'Texnika icarəsi', 'İşçi', 'Torpaq icarəsi', 'Su / suvarma', 'Elektrik', 'Daşınma', 'Yem', 'Baytar', 'Mal alışı', 'Digər'],
      incomeCats: ['Subsidiya', 'Xidmət', 'Digər'],
      units: ['t', 'kq', 'l', 'ədəd', 'baş', 'kisə', 'qutu'],
      season: ''
    },
    fields: [], items: [], moves: [], harvests: [], sales: [], spays: [], incomes: [],
    expenses: [], machines: [], jobs: [], workers: [], accruals: [], wpays: [], persons: [], ppays: []
  };
}
function seedItems(d) {
  d.items.push(
    { id: uid(), name: 'Buğda', unit: 't', module: 'taxil', low: 0 },
    { id: uid(), name: 'Arpa', unit: 't', module: 'taxil', low: 0 },
    { id: uid(), name: 'Dizel yanacağı', unit: 'l', module: 'material', low: 200 },
    { id: uid(), name: 'Gübrə', unit: 't', module: 'material', low: 0 },
    { id: uid(), name: 'Fındıq', unit: 'kq', module: 'findiq', low: 0 }
  );
}
function load() {
  try { const s = localStorage.getItem(KEY); DB = s ? JSON.parse(s) : null; } catch (e) { DB = null; }
  if (!DB) DB = defaults();
  const d = defaults();
  for (const k in d) if (DB[k] === undefined) DB[k] = d[k];
  for (const k in d.settings) if (DB.settings[k] === undefined) DB.settings[k] = d.settings[k];
  if (migratePersons()) save();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); scheduleSync(); return true; }
  catch (e) { toast('Yadda saxlanmadı: brauzerin yaddaşı doludur və ya bağlıdır.'); return false; }
}

/* ---------- axtarış ---------- */
const byId = (arr, id) => DB[arr].find(x => x.id === id);
const field = id => byId('fields', id);
const item = id => byId('items', id);
const machine = id => byId('machines', id);
const worker = id => byId('workers', id);
const fieldName = id => { const f = field(id); return f ? f.name : 'Ümumi'; };
const itemName = id => { const i = item(id); return i ? i.name : '—'; };
const itemUnit = id => { const i = item(id); return i ? i.unit : ''; };

/* ---------- hesablamalar ---------- */
function inRange(date, R) { if (!R) return true; if (R.from && date < R.from) return false; if (R.to && date > R.to) return false; return true; }
function stockQty(itemId) { return r2(DB.moves.filter(m => m.itemId === itemId).reduce((s, m) => s + num(m.qty), 0)); }

function costLines(R) {
  const L = [];
  DB.expenses.forEach(e => L.push({ date: e.date, cat: e.cat, amount: num(e.amount), fieldId: e.fieldId || '', module: e.module || 'taxil', note: (e.note || '') + (e.personId && person(e.personId) ? ' · ' + person(e.personId).name : '') + (e.pay === 'nisye' ? (expDebt(e) > 0.004 ? ' · nisyə, borc ' + fmt(expDebt(e)) : ' · nisyə, ödənib') : ''), src: 'Xərc', ref: e.id, kind: 'expense' }));
  DB.jobs.forEach(j => {
    const m = machine(j.machineId); const nm = m ? m.name : 'Texnika';
    const base = { date: j.date, fieldId: j.fieldId || '', module: 'taxil', note: nm, src: 'Texnika', ref: j.id, kind: 'job' };
    if (num(j.fuel) > 0) L.push(Object.assign({}, base, { cat: 'Yanacaq', amount: num(j.fuel) }));
    if (num(j.repair) > 0) L.push(Object.assign({}, base, { cat: 'Təmir', amount: num(j.repair) }));
    if (num(j.rent) > 0) L.push(Object.assign({}, base, { cat: 'Texnika icarəsi', amount: num(j.rent) }));
  });
  DB.accruals.forEach(a => { const w = worker(a.workerId); L.push({ date: a.date, cat: 'İşçi', amount: num(a.amount), fieldId: a.fieldId || '', module: a.module || 'taxil', note: w ? w.name : 'İşçi', src: 'İşçi', ref: a.id, kind: 'accrual' }); });
  return L.filter(l => inRange(l.date, R));
}
function incomeLines(R) {
  const L = [];
  DB.sales.forEach(s => { const it = item(s.itemId); L.push({ date: s.date, amount: num(s.total), fieldId: s.fieldId || '', module: it ? it.module : 'taxil', note: (it ? it.name : '') + ' ' + fmtQ(s.qty, it ? it.unit : ''), src: 'Satış', ref: s.id, kind: 'sale' }); });
  DB.incomes.forEach(i => L.push({ date: i.date, amount: num(i.amount), fieldId: i.fieldId || '', module: i.module || 'taxil', note: (i.cat || '') + (i.note ? ' · ' + i.note : ''), src: 'Gəlir', ref: i.id, kind: 'income' }));
  return L.filter(l => inRange(l.date, R));
}
const sum = (arr, f) => r2(arr.reduce((s, x) => s + (f ? f(x) : x), 0));

function salePaid(s) { return s.pay === 'nisye' ? sum(DB.spays.filter(p => p.saleId === s.id), p => num(p.amount)) : num(s.total); }
function saleDebt(s) { return r2(num(s.total) - salePaid(s)); }
function workerBalance(wid) { return r2(sum(DB.accruals.filter(a => a.workerId === wid), a => num(a.amount)) - sum(DB.wpays.filter(p => p.workerId === wid), p => num(p.amount))); }
function receivables() { return DB.sales.filter(s => s.pay === 'nisye' && saleDebt(s) > 0.004); }
function unpaidRents() { return DB.jobs.filter(j => num(j.rent) > 0 && !j.rentPaid); }
function payablesTotal() { return r2(sum(DB.workers, w => Math.max(0, workerBalance(w.id))) + sum(unpaidRents(), j => num(j.rent)) + sum(supplierDebts(), expDebt)); }

function fieldStats(fid, R) {
  const cost = sum(costLines(R).filter(l => l.fieldId === fid), l => l.amount);
  const inc = sum(incomeLines(R).filter(l => l.fieldId === fid), l => l.amount);
  const hv = DB.harvests.filter(h => h.fieldId === fid && inRange(h.date, R));
  const harvest = sum(hv, h => num(h.qty));
  const toStock = sum(hv.filter(h => h.dest === 'anbar'), h => num(h.qty));
  const onField = sum(hv.filter(h => h.dest !== 'anbar'), h => num(h.qty));
  const sl = DB.sales.filter(s => s.fieldId === fid && inRange(s.date, R));
  const soldField = sum(sl.filter(s => s.from === 'sahe'), s => num(s.qty));
  const soldStock = sum(sl.filter(s => s.from === 'anbar'), s => num(s.qty));
  return { cost, inc, profit: r2(inc - cost), harvest, toStock, onField, soldField, soldStock, fieldLeft: r2(onField - soldField) };
}
function lowStockItems() { return DB.items.filter(i => num(i.low) > 0 && stockQty(i.id) <= num(i.low)); }

/* ---------- UI köməkçiləri ---------- */
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function opts(list, sel, emptyLabel) {
  let h = emptyLabel != null ? `<option value="">${esc(emptyLabel)}</option>` : '';
  list.forEach(o => { h += `<option value="${esc(o.v)}"${o.v === sel ? ' selected' : ''}>${esc(o.t)}</option>`; });
  return h;
}
const fieldOpts = (sel, empty) => opts(DB.fields.map(f => ({ v: f.id, t: f.name + (f.crop ? ' · ' + itemName(f.crop) : '') })), sel, empty === undefined ? 'Ümumi (sahəyə aid deyil)' : empty);
const itemOpts = (sel, filter, empty) => opts(DB.items.filter(filter || (() => true)).map(i => ({ v: i.id, t: `${i.name} (${i.unit}) · ${modName(i.module)}` })), sel, empty);
const modOpts = (sel, list) => opts(MODULES.filter(m => !list || list.includes(m.id)).map(m => ({ v: m.id, t: m.name })), sel);
const catOpts = sel => { const cats = DB.settings.expenseCats.slice(); if (sel && !cats.includes(sel)) cats.push(sel); return opts(cats.map(c => ({ v: c, t: c })), sel); };

function fld(label, inner, cls, hint) { return `<div class="fld ${cls || ''}"><label>${label}</label>${inner}${hint ? `<div class="hint">${hint}</div>` : ''}</div>`; }
function inp(name, val, type, extra) { return `<input name="${name}" id="f_${name}" type="${type || 'text'}" value="${esc(val == null ? '' : val)}" ${extra || ''}>`; }
function numInp(name, val, extra) { return inp(name, val === 0 || val ? val : '', 'text', `inputmode="decimal" autocomplete="off" ${extra || ''}`); }
function sel(name, optionsHtml, extra) { return `<select name="${name}" id="f_${name}" ${extra || ''}>${optionsHtml}</select>`; }
function lbl(text, name) { return `<label for="f_${name}">${text}</label>`; }
function F(label, name, control, cls, hint) { return `<div class="fld ${cls || ''}">${lbl(label, name)}${control}${hint ? `<div class="hint">${hint}</div>` : ''}</div>`; }

let MODAL = null;
function openModal(title, body, onSave, o) {
  o = o || {};
  closeModal();
  const ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'modal';
  ov.innerHTML = `<form class="modal" role="dialog" aria-modal="true" aria-labelledby="mt" novalidate>
    <div class="mh"><h2 id="mt">${esc(title)}</h2><button type="button" class="icon-btn" data-a="closeModal" aria-label="Bağla">${ICON.x}</button></div>
    <div class="mb">${body}<div class="err" id="merr" role="alert"></div></div>
    <div class="mf">${o.extraBtn || ''}<button type="button" class="btn" data-a="closeModal">${onSave ? 'Ləğv et' : 'Bağla'}</button>${onSave ? `<button type="submit" class="btn pri" id="msave">${esc(o.saveLabel || 'Yadda saxla')}</button>` : ''}</div></form>`;
  document.body.appendChild(ov);
  const form = ov.querySelector('form');
  MODAL = { form, onSave, onInput: o.onInput };
  form.addEventListener('submit', e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    form.querySelectorAll('input[type=checkbox]').forEach(c => { data[c.name] = c.checked; });
    let res;
    try { res = onSave(data, form); } catch (err) { console.error(err); res = 'Xəta baş verdi: ' + err.message; }
    if (typeof res === 'string') { ov.querySelector('#merr').textContent = res; return; }

        ${Object.keys(byCat).length ? `<div class="tw"><table><tbody>${Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([c, v]) => `<tr><td>${esc(c)}</td><td class="n"><b>${fmt(v)}</b></td></tr>`).join('')}</tbody><tfoot><tr><td>Cəmi</td><td class="n">${fmt(s.cost)}</td></tr></tfoot></table></div>` : '<div class="empty">Xərc yoxdur</div>'}
      </div>
      <div class="card"><div class="card-h"><h3>Yığım</h3><button type="button" class="btn sm no-print" data-a="newHarvest" data-field="${f.id}">+ Yığım</button></div>

  };
}
function harvestForm(h, preField) {
  if (!DB.fields.length) return openModal('Əvvəl sahə lazımdır', '<p style="margin:0">Yığım yazmaq üçün əvvəlcə <b>Sahələr</b> bölməsində sahə əlavə edin.</p>', null);
  h = h || { date: todayStr(), fieldId: preField || '', dest: 'anbar' };
  const f0 = field(h.fieldId);
  openModal(h.id ? 'Yığımı dəyiş' : 'Məhsul yığımı', `<div class="form">
    ${F('Tarix', 'date', inp('date', h.date, 'date'))}
    ${F('Sahə', 'fieldId', sel('fieldId', fieldOpts(h.fieldId, '— seçin —')))}
    ${F('Məhsul', 'itemId', sel('itemId', itemOpts(h.itemId || (f0 && f0.crop), i => i.module === 'taxil' || i.module === 'findiq', '— seçin —')))}
    ${F('Miqdar', 'qty', numInp('qty', h.qty), '', 'Malın vahidi ilə (məs. ton)')}
    ${F('Hara getdi', 'dest', sel('dest', opts([{ v: 'anbar', t: 'Anbara (qalığa əlavə olunur)' }, { v: 'sahe', t: 'Sahədə qaldı / sahədən satılacaq' }], h.dest)), 'full')}
    ${F('Qeyd', 'note', inp('note', h.note), 'full')}
  </div>`, d => {
    if (!d.fieldId) return 'Sahəni seçin.'; if (!d.itemId) return 'Məhsulu seçin.'; if (num(d.qty) <= 0) return 'Miqdarı yazın.';
    if (h.id && h.dest === 'anbar') {
      const after = stockQty(h.itemId) - num(h.qty) + (d.dest === 'anbar' && d.itemId === h.itemId ? num(d.qty) : 0);
      if (after < -0.0001) return 'Bu məhsulun bir hissəsi artıq anbardan satılıb, qalıq mənfi olardı.';
    }
    const id = h.id || uid(); removeHarvest(id);
    DB.harvests.push({ id, date: d.date || todayStr(), fieldId: d.fieldId, itemId: d.itemId, qty: num(d.qty), dest: d.dest, note: d.note.trim() });
    if (d.dest === 'anbar') DB.moves.push({ id: uid(), date: d.date || todayStr(), itemId: d.itemId, qty: num(d.qty), type: 'harvest', ref: id, fieldId: d.fieldId, note: 'Yığım: ' + fieldName(d.fieldId) });
  });
}
function removeHarvest(id) { DB.harvests = DB.harvests.filter(x => x.id !== id); DB.moves = DB.moves.filter(m => m.ref !== id); }
A.newHarvest = ds => harvestForm(null, ds && ds.field);
A.edit_harvest = ds => harvestForm(Object.assign({}, byId('harvests', ds.id)));
A.del_harvest = ds => {
  const h = byId('harvests', ds.id);
  if (h.dest === 'anbar' && stockQty(h.itemId) - num(h.qty) < -0.0001) return openModal('Silmək olmur', '<p style="margin:0">Bu yığımın məhsulu artıq anbardan satılıb. Əvvəl həmin satışı silin.</p>', null);
  confirmBox('Bu yığım qeydi silinsin? Anbara gedibsə, qalıqdan da çıxılacaq.', () => removeHarvest(ds.id));
};

/* ---------- Anbar ---------- */
function pageStock() {
  const flt = VIEW.p.item || '';

    const q = stockQty(i.id); const low = num(i.low) > 0 && q <= num(i.low);
    return `<tr><td><b>${esc(i.name)}</b>${low ? ' <span class="tag debt">Az qalıb</span>' : ''}</td><td>${modName(i.module)}</td><td class="n"><b>${fmtQ(q, i.unit)}</b></td><td class="n">${num(i.low) ? fmtQ(i.low, i.unit) : '—'}</td>

  }).join('');
  const TYPES = { harvest: 'Yığım', in: 'Giriş', out: 'Çıxış', sale: 'Satış' };
  const mv = DB.moves.filter(m => !flt || m.itemId === flt).sort((a, b) => b.date.localeCompare(a.date)).slice(0, flt ? 1000 : 50);
  return {
    title: 'Anbar', sub: 'Qalıq və hərəkətlər',
    actions: `<button type="button" class="btn" data-a="newItem">+ Mal / məhsul</button><button type="button" class="btn" data-a="stockOut">↑ Çıxış</button><button type="button" class="btn pri" data-a="stockIn">↓ Giriş</button>`,
    body: `<div class="card"><div class="tw"><table><thead><tr><th>Mal</th><th>Bölmə</th><th class="n">Qalıq</th><th class="n">Xəbərdarlıq həddi</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="5" class="empty">Mal yoxdur</td></tr>'}</tbody></table></div></div>
    <div class="card" style="margin-top:16px"><div class="card-h"><h3>${flt ? 'Hərəkətlər: ' + esc(itemName(flt)) : 'Son hərəkətlər'}</h3>${flt ? `<button type="button" class="btn sm" data-a="go" data-p="stock">Hamısını göstər</button>` : ''}</div>
      ${mv.length ? `<div class="tw"><table><thead><tr><th>Tarix</th><th>Mal</th><th>Növ</th><th>Qeyd</th><th class="n">Miqdar</th><th></th></tr></thead><tbody>
      ${mv.map(m => `<tr><td>${fmtD(m.date)}</td><td>${esc(itemName(m.itemId))}</td><td>${TYPES[m.type] || m.type}</td><td>${esc(m.note)}</td><td class="n ${num(m.qty) >= 0 ? 'pos' : 'neg'}"><b>${num(m.qty) >= 0 ? '+' : ''}${fmtQ(m.qty, itemUnit(m.itemId))}</b></td>
        ${m.type === 'in' || m.type === 'out' ? rowActs('move', m.id, true) : '<td class="acts" style="font-size:12.5px;color:var(--muted)">öz bölməsindən</td>'}</tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">Hərəkət yoxdur</div>'}</div>`
  };
}
function itemForm(i, preModule) {
  i = i || { unit: 't', module: preModule || 'taxil', low: 0 };
  openModal(i.id ? 'Malı dəyiş' : 'Yeni mal / məhsul', `<div class="form">
    ${F('Adı', 'name', inp('name', i.name, 'text', 'placeholder="Məs: Buğda, Arpa, Süd, Fındıq"'), 'full')}
    ${F('Vahid', 'unit', sel('unit', opts(DB.settings.units.map(u => ({ v: u, t: u })), i.unit)))}
    ${F('Bölmə', 'module', sel('module', modOpts(i.module)))}
    ${F('Az qalıb xəbərdarlığı (həd)', 'low', numInp('low', i.low || ''), 'full', 'Qalıq bu rəqəmə düşəndə ana səhifədə xəbərdarlıq çıxır. Lazım deyilsə boş qoyun.')}
  </div>`, d => {
    if (!d.name.trim()) return 'Adını yazın.';
    if (DB.items.some(x => x.id !== i.id && x.name.toLowerCase() === d.name.trim().toLowerCase() && x.module === d.module)) return 'Bu adda mal artıq var.';
    const obj = { id: i.id || uid(), name: d.name.trim(), unit: d.unit, module: d.module, low: num(d.low) };
    if (i.id) Object.assign(item(i.id), obj); else DB.items.push(obj);

}
A.newItem = ds => itemForm(null, ds && ds.module);
A.edit_item = ds => itemForm(Object.assign({}, item(ds.id)));
A.del_item = ds => {

};

    ${F('Ödənilən pul, ₼ (alışdırsa)', 'amount', numInp('amount', ''), '', 'Pul ödənibsə yazın, avtomatik xərc kimi yazılacaq')}

      ${F('Hansı sahəyə aid', 'fieldId', sel('fieldId', fieldOpts('')))}

    const P = num(d.amount) > 0 ? resolvePerson(d) : { id: '', name: '' }; if (typeof P === 'string') return P;
    const id = uid(), it = item(d.itemId);

    if (num(d.amount) > 0) DB.expenses.push({ id: uid(), date: d.date || todayStr(), cat: d.cat, amount: num(d.amount), fieldId: d.fieldId, module: it.module === 'material' ? 'taxil' : it.module, note: `${it.name} ${fmtQ(d.qty, it.unit)} alış${d.note ? ' · ' + d.note.trim() : ''}`, moveRef: id, personId: P.id, pay: d.pay, paidNow: d.pay === 'nisye' ? num(d.paidNow) : 0 });
    if (num(d.amount) > 0 && d.pay === 'nisye' && num(d.paidNow) > 0) DB.ppays.push({ id: uid(), expId: DB.expenses[DB.expenses.length - 1].id, date: d.date || todayStr(), amount: num(d.paidNow), initial: true });
  }, { onInput: form => { show(form, 'costBox', num(fv(form, 'amount')) > 0); show(form, 'paidBox', fv(form, 'pay') === 'nisye'); show(form, 'newPBox', fv(form, 'personId') === '__new'); } });

function stockOutForm(preModule) {

    ${F('Tarix', 'date', inp('date', todayStr(), 'date'))}
    ${F('Mal', 'itemId', sel('itemId', itemOpts('', preModule ? i => i.module === preModule : null, '— seçin —')))}

    ${F('Hansı sahədə istifadə olunub', 'fieldId', sel('fieldId', fieldOpts('', '— yoxdur —')), 'full')}

    if (!d.itemId) return 'Malı seçin.'; if (num(d.qty) <= 0) return 'Miqdarı yazın.';

A.stockIn = ds => stockInForm(ds && ds.module);

A.del_move = ds => {
  const m = byId('moves', ds.id);
  if (num(m.qty) > 0 && stockQty(m.itemId) - num(m.qty) < -0.0001) return openModal('Silmək olmur', '<p style="margin:0">Bu girişdən sonra mal satılıb və ya çıxarılıb, qalıq mənfi olardı.</p>', null);
  const linked = DB.expenses.find(e => e.moveRef === m.id);
  confirmBox('Bu anbar hərəkəti silinsin?' + (linked ? ` Bağlı xərc (${fmt(linked.amount)}) də silinəcək.` : ''), () => {
    DB.moves = DB.moves.filter(x => x.id !== m.id); DB.expenses = DB.expenses.filter(e => e.moveRef !== m.id);
  });
};


/* ====== Texnika, işçilər, satış, xərclər, borclar, modullar ====== */

/* ---------- Texnika ---------- */
function machineStats(mid) {
  const js = DB.jobs.filter(j => j.machineId === mid);
  return { ha: sum(js, j => num(j.ha)), hours: sum(js, j => num(j.hours)), fuel: sum(js, j => num(j.fuel)), repair: sum(js, j => num(j.repair)), rent: sum(js, j => num(j.rent)), unpaid: sum(js.filter(j => num(j.rent) > 0 && !j.rentPaid), j => num(j.rent)), n: js.length };
}
function pageMachines() {
  const total = sum(costLines().filter(l => l.kind === 'job'), l => l.amount);
  const block = kind => {
    const list = DB.machines.filter(m => m.kind === kind);
    if (!list.length) return `<div class="empty">${kind === 'oz' ? 'Öz texnikanız əlavə olunmayıb' : 'İcarə texnikası əlavə olunmayıb'}</div>`;
    return `<div class="tw"><table><thead><tr><th>Texnika</th><th class="n">İşlədiyi</th><th class="n">Yanacaq</th><th class="n">Təmir</th>${kind === 'icare' ? '<th class="n">İcarə haqqı</th><th class="n">Ödənilməyib</th>' : ''}<th class="n">Cəmi xərc</th><th></th></tr></thead><tbody>
      ${list.map(m => { const s = machineStats(m.id); return `<tr><td><b>${esc(m.name)}</b>${m.owner ? `<div style="font-size:12.5px;color:var(--muted)">Sahibi: ${esc(m.owner)}</div>` : ''}</td><td class="n">${fmtN(s.ha)} ha${s.hours ? ' · ' + fmtN(s.hours) + ' saat' : ''}</td><td class="n">${fmt(s.fuel)}</td><td class="n">${fmt(s.repair)}</td>${kind === 'icare' ? `<td class="n">${fmt(s.rent)}</td><td class="n ${s.unpaid ? 'neg' : ''}">${fmt(s.unpaid)}</td>` : ''}<td class="n"><b>${fmt(s.fuel + s.repair + s.rent)}</b></td>
        <td class="acts no-print"><button type="button" class="btn sm" data-a="newJob" data-machine="${m.id}">+ İş yaz</button> <button type="button" class="icon-btn" data-a="edit_machine" data-id="${m.id}" aria-label="Düzəliş et">${ICON.edit}</button> <button type="button" class="icon-btn" data-a="del_machine" data-id="${m.id}" aria-label="Sil">${ICON.del}</button></td></tr>`; }).join('')}
    </tbody></table></div>`;
  };
  const jobs = DB.jobs.slice().sort((a, b) => b.date.localeCompare(a.date));
  return {
    title: 'Texnika', sub: 'Öz və icarə texnikası',
    actions: `<button type="button" class="btn" data-a="newMachine">+ Texnika əlavə et</button><button type="button" class="btn pri" data-a="newJob">+ İş yaz</button>`,
    body: `<div class="card pad stat" style="max-width:340px;background:#B5541C;border-color:#B5541C;color:#fff"><div class="l" style="color:#fff">Texnikaya ümumi xərc</div><div class="v">${fmt(total)}</div></div>
    <div class="card" style="margin-top:16px"><div class="card-h"><h3><span class="tag own">Öz</span> Öz texnika</h3></div>${block('oz')}</div>
    <div class="card" style="margin-top:16px"><div class="card-h"><h3><span class="tag rent">İcarə</span> İcarə texnika</h3></div>${block('icare')}</div>
    <div class="card" style="margin-top:16px"><div class="card-h"><h3>İş qeydləri</h3></div>
      ${jobs.length ? `<div class="tw"><table><thead><tr><th>Tarix</th><th>Texnika</th><th>Sahə</th><th class="n">Ha / saat</th><th class="n">Yanacaq</th><th class="n">Təmir</th><th class="n">İcarə</th><th></th></tr></thead><tbody>
      ${jobs.map(j => `<tr><td>${fmtD(j.date)}</td><td>${esc((machine(j.machineId) || {}).name || '—')}</td><td>${esc(fieldName(j.fieldId))}</td><td class="n">${fmtN(j.ha)} ha${num(j.hours) ? ' · ' + fmtN(j.hours) + ' s' : ''}</td><td class="n">${fmt(j.fuel)}</td><td class="n">${fmt(j.repair)}</td><td class="n">${num(j.rent) ? fmt(j.rent) + ' ' + (j.rentPaid ? '<span class="tag paid">ödənib</span>' : '<span class="tag debt">borc</span>') : '—'}</td>${rowActs('job', j.id)}</tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">İş yazılmayıb. Texnika sahədə işləyəndə <b>+ İş yaz</b> basın — xərc avtomatik həmin sahəyə yazılır.</div>'}</div>`
  };
}
function machineForm(m) {
  m = m || { kind: 'oz' };
  openModal(m.id ? 'Texnikanı dəyiş' : 'Yeni texnika', `<div class="form">
    ${F('Adı', 'name', inp('name', m.name, 'text', 'placeholder="Məs: Traktor MTZ-82, Kombayn"'), 'full')}
    ${F('Növ', 'kind', sel('kind', opts([{ v: 'oz', t: 'Öz texnikam' }, { v: 'icare', t: 'İcarə' }], m.kind)))}
    ${F('Sahibi (icarədirsə)', 'owner', inp('owner', m.owner))}
  </div>`, d => {
    if (!d.name.trim()) return 'Adını yazın.';
    const obj = { id: m.id || uid(), name: d.name.trim(), kind: d.kind, owner: d.owner.trim() };
    if (m.id) Object.assign(machine(m.id), obj); else DB.machines.push(obj);
  });
}
A.newMachine = () => machineForm();
A.edit_machine = ds => machineForm(Object.assign({}, machine(ds.id)));
A.del_machine = ds => {
  if (DB.jobs.some(j => j.machineId === ds.id)) return openModal('Silmək olmur', '<p style="margin:0">Bu texnikanın iş qeydləri var. Əvvəl onları silin.</p>', null);
  confirmBox(`<b>${esc(machine(ds.id).name)}</b> silinsin?`, () => { DB.machines = DB.machines.filter(x => x.id !== ds.id); });
};
function jobForm(j, preMachine) {
  if (!DB.machines.length) return openModal('Əvvəl texnika lazımdır', '<p style="margin:0">Əvvəlcə <b>+ Texnika əlavə et</b> ilə texnikanı yazın.</p>', null);
  j = j || { date: todayStr(), machineId: preMachine || '' };
  openModal(j.id ? 'İşi dəyiş' : 'Texnika işi', `<div class="form">
    ${F('Tarix', 'date', inp('date', j.date, 'date'))}
    ${F('Texnika', 'machineId', sel('machineId', opts(DB.machines.map(m => ({ v: m.id, t: m.name + (m.kind === 'icare' ? ' (icarə)' : ' (öz)') })), j.machineId, '— seçin —')))}
    ${F('Sahə', 'fieldId', sel('fieldId', fieldOpts(j.fieldId)))}
    ${F('İş (məs. şum, səpin, biçin)', 'work', inp('work', j.work))}
    ${F('Hektar', 'ha', numInp('ha', j.ha))}
    ${F('Saat', 'hours', numInp('hours', j.hours))}
    ${F('Yanacaq xərci, ₼', 'fuel', numInp('fuel', j.fuel))}
    ${F('Təmir xərci, ₼', 'repair', numInp('repair', j.repair))}
    <div id="rentBox" class="full form" style="padding:0">
      ${F('İcarə haqqı, ₼', 'rent', numInp('rent', j.rent))}
      <div class="fld"><label>&nbsp;</label><label class="chk"><input type="checkbox" name="rentPaid" ${j.rentPaid ? 'checked' : ''}> İcarə haqqı ödənilib</label></div>
    </div>
  </div>`, d => {
    if (!d.machineId) return 'Texnikanı seçin.';
    const m = machine(d.machineId);
    const obj = { id: j.id || uid(), date: d.date || todayStr(), machineId: d.machineId, fieldId: d.fieldId, work: d.work.trim(), ha: num(d.ha), hours: num(d.hours), fuel: num(d.fuel), repair: num(d.repair), rent: m.kind === 'icare' ? num(d.rent) : 0, rentPaid: m.kind === 'icare' ? !!d.rentPaid : false };
    if (!obj.ha && !obj.hours && !obj.fuel && !obj.repair && !obj.rent) return 'Ən azı hektar, saat və ya bir xərc yazın.';
    if (j.id) Object.assign(byId('jobs', j.id), obj); else DB.jobs.push(obj);
  }, { onInput: form => { const m = machine(fv(form, 'machineId')); show(form, 'rentBox', !!m && m.kind === 'icare'); } });
}
A.newJob = ds => jobForm(null, ds && ds.machine);
A.edit_job = ds => jobForm(Object.assign({}, byId('jobs', ds.id)));
A.del_job = ds => confirmBox('Bu iş qeydi silinsin? Ona bağlı xərclər də silinəcək.', () => { DB.jobs = DB.jobs.filter(x => x.id !== ds.id); });

/* ---------- İşçilər ---------- */
function pageWorkers() {
  const m0 = todayStr().slice(0, 7);
  const rows = DB.workers.map(w => {
    const acc = DB.accruals.filter(a => a.workerId === w.id);
    const days = sum(acc.filter(a => a.date.slice(0, 7) === m0), a => num(a.days));
    const bal = workerBalance(w.id);
    return `<tr><td><b>${esc(w.name)}</b><div style="font-size:12.5px;color:var(--muted)">${esc(w.role || '')}${w.phone ? ' · ' + esc(w.phone) : ''}</div></td><td>${w.pay === 'gunluk' ? `Gündəlik ${fmt(w.rate)}` : `Aylıq ${fmt(w.rate)}`}</td><td class="n">${fmtN(days)}</td><td class="n">${fmt(sum(acc, a => num(a.amount)))}</td><td class="n">${fmt(sum(DB.wpays.filter(p => p.workerId === w.id), p => num(p.amount)))}</td><td class="n ${bal > 0 ? 'neg' : ''}"><b>${fmt(bal)}</b></td>
      <td class="acts no-print"><button type="button" class="btn sm" data-a="newAccrual" data-worker="${w.id}">${w.pay === 'gunluk' ? 'İş günü yaz' : 'Maaş yaz'}</button> <button type="button" class="btn sm" data-a="newWPay" data-worker="${w.id}">Ödəniş et</button> <button type="button" class="icon-btn" data-a="edit_worker" data-id="${w.id}" aria-label="Düzəliş et">${ICON.edit}</button> <button type="button" class="icon-btn" data-a="del_worker" data-id="${w.id}" aria-label="Sil">${ICON.del}</button></td></tr>`;
  }).join('');
  const ops = [...DB.accruals.map(a => ({ t: 'acc', o: a })), ...DB.wpays.map(p => ({ t: 'pay', o: p }))].sort((a, b) => b.o.date.localeCompare(a.o.date)).slice(0, 60);
  const totalBal = sum(DB.workers, w => Math.max(0, workerBalance(w.id)));
  return {
    title: 'İşçilər', sub: `${DB.workers.length} nəfər · ödənilməmiş borc ${fmt(totalBal)}`,
    actions: `<button type="button" class="btn pri" data-a="newWorker">+ İşçi əlavə et</button>`,
    body: `<div class="card">${DB.workers.length ? `<div class="tw"><table><thead><tr><th>İşçi</th><th>Ödəniş</th><th class="n">Bu ay gün</th><th class="n">Hesablanıb</th><th class="n">Ödənib</th><th class="n">Qalıq borc</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="empty">İşçi yoxdur</div>'}</div>
    <div class="card" style="margin-top:16px"><div class="card-h"><h3>Qeydlər</h3></div>
      ${ops.length ? `<div class="tw"><table><thead><tr><th>Tarix</th><th>İşçi</th><th>Növ</th><th>Sahə</th><th class="n">Gün</th><th class="n">Məbləğ</th><th></th></tr></thead><tbody>
      ${ops.map(x => x.t === 'acc'
        ? `<tr><td>${fmtD(x.o.date)}</td><td>${esc((worker(x.o.workerId) || {}).name || '—')}</td><td>Hesablandı${x.o.note ? ' · ' + esc(x.o.note) : ''}</td><td>${esc(fieldName(x.o.fieldId))}</td><td class="n">${num(x.o.days) ? fmtN(x.o.days) : '—'}</td><td class="n">${fmt(x.o.amount)}</td>${rowActs('accrual', x.o.id)}</tr>`
        : `<tr><td>${fmtD(x.o.date)}</td><td>${esc((worker(x.o.workerId) || {}).name || '—')}</td><td><span class="tag paid">Ödəniş</span>${x.o.note ? ' ' + esc(x.o.note) : ''}</td><td>—</td><td class="n">—</td><td class="n pos">${fmt(x.o.amount)}</td>${rowActs('wpay', x.o.id, true)}</tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">Qeyd yoxdur</div>'}</div>`
  };
}
function workerForm(w) {
  w = w || { pay: 'gunluk' };
  openModal(w.id ? 'İşçini dəyiş' : 'Yeni işçi', `<div class="form">
    ${F('Ad, soyad', 'name', inp('name', w.name), 'full')}
    ${F('Vəzifə', 'role', inp('role', w.role, 'text', 'placeholder="Məs: traktorçu, fəhlə"'))}
    ${F('Telefon', 'phone', inp('phone', w.phone, 'tel'))}
    ${F('Ödəniş növü', 'pay', sel('pay', opts([{ v: 'gunluk', t: 'Gündəlik' }, { v: 'ayliq', t: 'Aylıq' }], w.pay)))}
    ${F('Məbləğ, ₼ (günlük və ya aylıq)', 'rate', numInp('rate', w.rate))}
  </div>`, d => {
    if (!d.name.trim()) return 'Adını yazın.'; if (num(d.rate) <= 0) return 'Məbləği yazın.';
    const obj = { id: w.id || uid(), name: d.name.trim(), role: d.role.trim(), phone: d.phone.trim(), pay: d.pay, rate: num(d.rate) };
    if (w.id) Object.assign(worker(w.id), obj); else DB.workers.push(obj);
  });
}
A.newWorker = () => workerForm();
A.edit_worker = ds => workerForm(Object.assign({}, worker(ds.id)));
A.del_worker = ds => {
  if (DB.accruals.some(a => a.workerId === ds.id) || DB.wpays.some(p => p.workerId === ds.id)) return openModal('Silmək olmur', '<p style="margin:0">Bu işçinin qeydləri var. Əvvəl onları silin.</p>', null);
  confirmBox(`<b>${esc(worker(ds.id).name)}</b> silinsin?`, () => { DB.workers = DB.workers.filter(x => x.id !== ds.id); });
};
function accrualForm(a, preWorker) {
  if (!DB.workers.length) return openModal('Əvvəl işçi lazımdır', '<p style="margin:0">Əvvəlcə <b>İşçilər</b> bölməsində işçi əlavə edin.</p>', null);
  a = a || { date: todayStr(), workerId: preWorker || '', days: 1, module: 'taxil' };
  openModal(a.id ? 'Qeydi dəyiş' : 'İş günü / maaş yaz', `<div class="form">
    ${F('İşçi', 'workerId', sel('workerId', opts(DB.workers.map(w => ({ v: w.id, t: w.name + (w.pay === 'gunluk' ? ' (gündəlik)' : ' (aylıq)') })), a.workerId, '— seçin —')))}
    ${F('Tarix', 'date', inp('date', a.date, 'date'))}
    ${F('Gün sayı', 'days', numInp('days', a.days))}
    ${F('Məbləğ, ₼', 'amount', numInp('amount', a.amount), '', 'Gündəlik işçidə gün × qiymət avtomatik hesablanır, dəyişə bilərsiniz')}
    ${F('Sahə', 'fieldId', sel('fieldId', fieldOpts(a.fieldId)))}
    ${F('Bölmə', 'module', sel('module', modOpts(a.module, ['taxil', 'ferma', 'findiq', 'derman'])))}
    ${F('Qeyd', 'note', inp('note', a.note), 'full')}
  </div>`, d => {
    if (!d.workerId) return 'İşçini seçin.'; if (num(d.amount) <= 0) return 'Məbləği yazın.';
    const obj = { id: a.id || uid(), workerId: d.workerId, date: d.date || todayStr(), days: num(d.days), amount: num(d.amount), fieldId: d.fieldId, module: d.module, note: d.note.trim() };
    if (a.id) Object.assign(byId('accruals', a.id), obj); else DB.accruals.push(obj);
  }, { onInput: form => {
    if (form.dataset.manual === '1') return;
    const w = worker(fv(form, 'workerId')); if (!w) return;
    form.querySelector('[name=amount]').value = w.pay === 'gunluk' ? r2(num(fv(form, 'days')) * num(w.rate)) : w.rate;
  } });
  const amt = MODAL.form.querySelector('[name=amount]');
  amt.addEventListener('input', () => { MODAL.form.dataset.manual = '1'; });
  if (a.id) { MODAL.form.dataset.manual = '1'; amt.value = a.amount; }
}
A.newAccrual = ds => accrualForm(null, ds && ds.worker);
A.edit_accrual = ds => accrualForm(Object.assign({}, byId('accruals', ds.id)));
A.del_accrual = ds => confirmBox('Bu qeyd silinsin?', () => { DB.accruals = DB.accruals.filter(x => x.id !== ds.id); });
function wpayForm(preWorker) {
  if (!DB.workers.length) return;
  openModal('İşçiyə ödəniş', `<div class="form">
    ${F('İşçi', 'workerId', sel('workerId', opts(DB.workers.map(w => ({ v: w.id, t: w.name })), preWorker || '', '— seçin —')))}
    ${F('Tarix', 'date', inp('date', todayStr(), 'date'))}
    ${F('Məbləğ, ₼', 'amount', numInp('amount', ''))}
    ${F('Qeyd', 'note', inp('note', ''))}
    <div class="full hint" id="balInfo"></div>
  </div>`, d => {
    if (!d.workerId) return 'İşçini seçin.'; if (num(d.amount) <= 0) return 'Məbləği yazın.';
    DB.wpays.push({ id: uid(), workerId: d.workerId, date: d.date || todayStr(), amount: num(d.amount), note: d.note.trim() });
  }, { onInput: form => { const w = fv(form, 'workerId'); const amt = form.querySelector('[name=amount]');
    form.querySelector('#balInfo').textContent = w ? `Qalıq borc: ${fmt(workerBalance(w))}` : '';
    if (w && form.dataset.lastW !== w) { form.dataset.lastW = w; amt.value = workerBalance(w) > 0 ? workerBalance(w) : ''; } } });
}
A.newWPay = ds => wpayForm(ds && ds.worker);
A.del_wpay = ds => confirmBox('Bu ödəniş silinsin?', () => { DB.wpays = DB.wpays.filter(x => x.id !== ds.id); });

/* ---------- Satış ---------- */
/* ---------- süzgəclər (satış / xərc) ---------- */
function periodOf(def) {
  const per = VIEW.p.per || def, t = todayStr(), d = new Date(t);
  if (per === 'today') return { R: { from: t, to: t }, label: 'Bu gün' };
  if (per === 'week') { const w = (d.getDay() + 6) % 7; const m = new Date(d); m.setDate(d.getDate() - w); return { R: { from: m.toISOString().slice(0, 10), to: t }, label: 'Bu həftə' }; }
  if (per === 'month') return { R: { from: t.slice(0, 7) + '-01', to: t.slice(0, 7) + '-31' }, label: monthLabel() };
  if (per === 'year') return { R: { from: t.slice(0, 4) + '-01-01', to: t.slice(0, 4) + '-12-31' }, label: t.slice(0, 4) + '-ci il' };
  if (per === 'custom') return { R: { from: VIEW.p.pfrom || '', to: VIEW.p.pto || '' }, label: `${VIEW.p.pfrom ? fmtD(VIEW.p.pfrom) : '…'} – ${VIEW.p.pto ? fmtD(VIEW.p.pto) : '…'}` };
  return { R: null, label: 'Bütün dövr' };
}
const chip = (k, v, t, cur) => `<button type="button" class="chip${cur === v ? ' on' : ''}" data-a="fSet" data-k="${k}" data-v="${v}">${t}</button>`;
A.fSet = ds => { VIEW.p[ds.k] = ds.v; render(); };
function filterBar(o) {
  const per = VIEW.p.per || o.defPer, fmod = VIEW.p.fmod || '';
  const mods = MODULES.filter(m => m.id !== 'material' && (o.modUsed || []).includes(m.id));
  const selS = 'height:40px;border-radius:10px;border:1px solid #CFCABB;padding:0 10px;background:#fff;max-width:100%';
  return `<div class="fbar no-print">
    ${o.mod ? '' : `<div class="chips">${chip('fmod', '', 'Hamısı', fmod)}${mods.map(m => chip('fmod', m.id, m.name, fmod)).join('')}</div>`}
    <div class="chips">${[['today', 'Bu gün'], ['week', 'Bu həftə'], ['month', 'Bu ay'], ['year', 'Bu il'], ['all', 'Hamısı'], ['custom', 'Tarix seç']].map(([v, t]) => chip('per', v, t, per)).join('')}</div>
    ${per === 'custom' ? `<div class="row" style="gap:8px"><input type="date" data-change="f:pfrom" value="${esc(VIEW.p.pfrom || '')}" style="${selS}"><input type="date" data-change="f:pto" value="${esc(VIEW.p.pto || '')}" style="${selS}"></div>` : ''}
    <div class="row" style="gap:8px;flex-wrap:wrap">${o.extra || ''}<input type="search" data-change="f:q" value="${esc(VIEW.p.q || '')}" placeholder="${o.qph}" style="${selS};flex:1;min-width:160px"></div>
  </div>`;
}
function pageSales(mod) {
  const fmod = mod || VIEW.p.fmod || '', { R, label } = periodOf('month'), q = normName(VIEW.p.q || '');
  const all = DB.sales.filter(s => (!fmod || (item(s.itemId) || {}).module === fmod));
  let list = all.filter(s => inRange(s.date, R) && (!VIEW.p.fitem || s.itemId === VIEW.p.fitem) && (!VIEW.p.fpay || s.pay === VIEW.p.fpay) && (!q || normName(saleBuyer(s) + ' ' + (s.note || '') + ' ' + itemName(s.itemId)).includes(q)));
  const srt = VIEW.p.sort || 'dd';
  list.sort((a, b) => srt === 'da' ? a.date.localeCompare(b.date) : srt === 'ad' ? num(b.total) - num(a.total) : srt === 'aa' ? num(a.total) - num(b.total) : srt === 'bu' ? saleBuyer(a).localeCompare(saleBuyer(b), 'az') : b.date.localeCompare(a.date));
  const inc = DB.incomes.filter(i => (!fmod || i.module === fmod) && inRange(i.date, R)).sort((a, b) => b.date.localeCompare(a.date));
  const usedItems = [...new Set(all.map(s => s.itemId))].map(id => ({ v: id, t: itemName(id) })).sort((a, b) => a.t.localeCompare(b.t, 'az'));
  const selS = 'height:40px;border-radius:10px;border:1px solid #CFCABB;padding:0 10px;background:#fff';
  const extra = `<select data-change="f:fitem" style="${selS}">${opts(usedItems, VIEW.p.fitem || '', 'Bütün məhsullar')}</select>
    <select data-change="f:fpay" style="${selS}">${opts(Object.entries(PAYTYPES).map(([v, t]) => ({ v, t })), VIEW.p.fpay || '', 'Bütün ödənişlər')}</select>

  const total = sum(list, s => num(s.total)), paid = sum(list, salePaid), debt = sum(list, saleDebt);
  const breakdown = list.length ? `<div class="card" style="margin-top:16px"><div class="card-h"><h3>Bölgü · ${esc(label)}</h3></div><div class="tw"><table><thead><tr><th>Bölmə / məhsul</th><th class="n">Satış sayı</th><th class="n">Miqdar</th><th class="n">Məbləğ</th><th class="n">Pay</th></tr></thead><tbody>

    </tbody></table></div></div>` : '';
  const html = `${filterBar({ mod, defPer: 'month', modUsed, extra, qph: 'Axtar: alıcı, məhsul, qeyd' })}
    <div class="print-only" style="margin-bottom:8px">Dövr: ${esc(label)}${fmod ? ' · ' + esc(modName(fmod)) : ''}</div>
    <div class="grid g4">
      <div class="card pad stat"><div class="l">Satış sayı · ${esc(label)}</div><div class="v">${list.length}</div></div>
      <div class="card pad stat dark"><div class="l">Ümumi məbləğ</div><div class="v">${fmt(total)}</div></div>
      <div class="card pad stat"><div class="l">Alınan pul</div><div class="v pos">${fmt(paid)}</div></div>
      <div class="card pad stat"><div class="l">Nisyə qalığı</div><div class="v neg">${fmt(debt)}</div></div></div>
    ${breakdown}
    <div class="card" style="margin-top:16px"><div class="card-h"><h3>Satışlar (${list.length})</h3></div>${list.length ? `<div class="tw"><table><thead><tr><th>Tarix</th><th>Məhsul</th><th>Haradan</th><th>Sahə</th><th>Alıcı</th><th class="n">Miqdar</th><th class="n">Qiymət</th><th class="n">Cəmi</th><th>Ödəniş</th><th></th></tr></thead><tbody>

    </tbody><tfoot><tr><td colspan="7">Cəmi</td><td class="n">${fmt(total)}</td><td colspan="2"></td></tr></tfoot></table></div>` : '<div class="empty">Seçilən süzgəcə uyğun satış yoxdur</div>'}</div>
    <div class="card" style="margin-top:16px"><div class="card-h"><h3>Digər gəlirlər · ${esc(label)}</h3><button type="button" class="btn sm no-print" data-a="newIncome" data-module="${mod || ''}">+ Digər gəlir</button></div>${inc.length ? `<div class="tw"><table><thead><tr><th>Tarix</th><th>Növ</th><th>Bölmə</th><th>Sahə</th><th>Qeyd</th><th class="n">Məbləğ</th><th></th></tr></thead><tbody>

function saleForm(s, pre) {
  pre = pre || {};
  if (!DB.items.length) return;
  s = s || { date: todayStr(), from: pre.field ? 'sahe' : 'anbar', fieldId: pre.field || '', pay: 'nagd' };
  const f0 = field(s.fieldId);
  const filter = pre.module ? (i => i.module === pre.module) : (i => i.module !== 'material');
  openModal(s.id ? 'Satışı dəyiş' : 'Yeni satış', `<div class="form">
    ${F('Tarix', 'date', inp('date', s.date, 'date'))}
    ${F('Məhsul', 'itemId', sel('itemId', itemOpts(s.itemId || (f0 && f0.crop) || '', filter, '— seçin —')))}
    ${F('Haradan', 'from', sel('from', opts([{ v: 'anbar', t: 'Anbardan (qalıq azalır)' }, { v: 'sahe', t: 'Birbaşa sahədən' }], s.from)))}
    ${F('Sahə', 'fieldId', sel('fieldId', fieldOpts(s.fieldId, '— yoxdur —')), '', '<span id="fieldHint">Hansı sahənin məhsuludur (hesabat üçün)</span>')}
    ${F('Miqdar', 'qty', numInp('qty', s.qty))}
    ${F('Qiymət (1 vahid), ₼', 'price', numInp('price', s.price))}
    ${personPicker('Alıcı (kimə satılır)', s.personId || pre.person || '', '— alıcı yazılmayıb —')}
    ${F('Ödəniş', 'pay', sel('pay', opts(Object.entries(PAYTYPES).map(([v, t]) => ({ v, t })), s.pay)))}
    <div id="paidBox" class="full">${F('İndi ödənən hissə, ₼ (nisyədə)', 'paidNow', numInp('paidNow', s.paidNow))}</div>
    <div class="full calc"><span>Cəmi</span><b id="totalOut">0 ₼</b></div>
    <div class="full hint" id="stockInfo"></div>
    ${F('Qeyd', 'note', inp('note', s.note), 'full')}
  </div>`, d => {
    if (!d.itemId) return 'Məhsulu seçin.'; if (num(d.qty) <= 0) return 'Miqdarı yazın.'; if (num(d.price) <= 0) return 'Qiyməti yazın.';
    if (d.from === 'sahe' && !d.fieldId) return 'Sahədən satışda sahəni seçin.';
    if (d.pay === 'nisye' && !d.personId) return 'Nisyə satışda alıcını seçin və ya yeni şəxs əlavə edin.';
    if (d.personId === '__new' && !String(d.newName || '').trim()) return 'Yeni alıcının adını yazın.';
    const total = r2(num(d.qty) * num(d.price));
    if (d.pay === 'nisye' && num(d.paidNow) > total) return 'İndi ödənən hissə cəmidən çox ola bilməz.';
    if (d.from === 'anbar') {
      const avail = stockQty(d.itemId) + (s.id && s.from === 'anbar' && s.itemId === d.itemId ? num(s.qty) : 0);
      if (num(d.qty) > avail + 0.0001) return `Anbarda bu qədər yoxdur. Qalıq: ${fmtQ(avail, itemUnit(d.itemId))}`;
    }
    const P = resolvePerson(d); if (typeof P === 'string') return P;
    const id = s.id || uid();
    const oldPays = s.id ? DB.spays.filter(p => p.saleId === id && !p.initial) : [];
    removeSale(id);
    DB.sales.push({ id, date: d.date || todayStr(), itemId: d.itemId, from: d.from, fieldId: d.fieldId, qty: num(d.qty), price: num(d.price), total, buyer: P.name, personId: P.id, pay: d.pay, paidNow: d.pay === 'nisye' ? num(d.paidNow) : 0, note: d.note.trim() });
    if (d.from === 'anbar') DB.moves.push({ id: uid(), date: d.date || todayStr(), itemId: d.itemId, qty: -num(d.qty), type: 'sale', ref: id, note: 'Satış' + (P.name ? ' · ' + P.name : '') });
    if (d.pay === 'nisye' && num(d.paidNow) > 0) DB.spays.push({ id: uid(), saleId: id, date: d.date || todayStr(), amount: num(d.paidNow), initial: true });
    if (d.pay === 'nisye') oldPays.forEach(p => DB.spays.push(p));
  }, { onInput: form => {
    const q = num(fv(form, 'qty')), p = num(fv(form, 'price'));
    form.querySelector('#totalOut').textContent = fmt(r2(q * p));
    show(form, 'newPBox', fv(form, 'personId') === '__new');
    show(form, 'paidBox', fv(form, 'pay') === 'nisye');
    const it = fv(form, 'itemId'), from = fv(form, 'from');
    form.querySelector('#stockInfo').textContent = it && from === 'anbar' ? `Anbarda var: ${fmtQ(stockQty(it) + (s.id && s.from === 'anbar' && s.itemId === it ? num(s.qty) : 0), itemUnit(it))}` : '';
    form.querySelector('#fieldHint').textContent = from === 'sahe' ? 'Məcburidir: hansı sahədən satılır' : 'Hansı sahənin məhsuludur (hesabat üçün, könüllü)';
  } });
}

A.newSale = ds => saleForm(null, ds ? { field: ds.field, module: ds.module, person: ds.person } : {});

function pageExpenses(mod) {
  const fmod = mod || VIEW.p.fmod || '', { R, label } = periodOf('month'), q = normName(VIEW.p.q || '');
  const allL = costLines();
  let lines = allL.filter(l => (!fmod || l.module === fmod) && inRange(l.date, R) && (!VIEW.p.fcat || l.cat === VIEW.p.fcat) && (!q || normName(l.cat + ' ' + (l.note || '') + ' ' + fieldName(l.fieldId)).includes(q)));
  const srt = VIEW.p.sort || 'dd';
  lines.sort((a, b) => srt === 'da' ? a.date.localeCompare(b.date) : srt === 'ad' ? b.amount - a.amount : srt === 'aa' ? a.amount - b.amount : b.date.localeCompare(a.date));
  const cats = [...new Set(allL.map(l => l.cat))].sort((a, b) => a.localeCompare(b, 'az')).map(c => ({ v: c, t: c }));
  const selS = 'height:40px;border-radius:10px;border:1px solid #CFCABB;padding:0 10px;background:#fff';
  const extra = `<select data-change="f:fcat" style="${selS}">${opts(cats, VIEW.p.fcat || '', 'Bütün kateqoriyalar')}</select>
    <select data-change="f:sort" style="${selS}">${opts([{ v: 'dd', t: 'Yeni → köhnə' }, { v: 'da', t: 'Köhnə → yeni' }, { v: 'ad', t: 'Məbləğ: çox → az' }, { v: 'aa', t: 'Məbləğ: az → çox' }], srt)}</select>`;
  const modUsed = [...new Set(allL.map(l => l.module))];
  const total = sum(lines, l => l.amount);
  const byCat = {}, byMod = {}; lines.forEach(l => { byCat[l.cat] = r2((byCat[l.cat] || 0) + l.amount); byMod[l.module] = r2((byMod[l.module] || 0) + l.amount); });
  const rows = o => Object.entries(o).sort((a, b) => b[1] - a[1]).map(([c, v]) => `<tr><td>${esc(c)}</td><td class="n"><b>${fmt(v)}</b></td><td class="n">${total ? Math.round(v / total * 100) : 0}%</td></tr>`).join('') || '<tr><td class="empty">—</td></tr>';
  const html = `${filterBar({ mod, defPer: 'month', modUsed, extra, qph: 'Axtar: qeyd, kateqoriya, sahə' })}
    <div class="print-only" style="margin-bottom:8px">Dövr: ${esc(label)}${fmod ? ' · ' + esc(modName(fmod)) : ''}</div>
    <div class="grid g2"><div class="card pad stat" style="background:#A23B32;border-color:#A23B32;color:#fff"><div class="l" style="color:#fff">${esc(label)} · cəmi xərc (${lines.length} qeyd)</div><div class="v">${fmt(total)}</div></div>
    <div class="card"><div class="card-h"><h3>Kateqoriyalar üzrə</h3></div><div class="tw"><table><tbody>${rows(byCat)}</tbody></table></div></div></div>
    ${!mod && Object.keys(byMod).length > 1 ? `<div class="card" style="margin-top:16px"><div class="card-h"><h3>Bölmələr üzrə</h3></div><div class="tw"><table><tbody>${rows(Object.fromEntries(Object.entries(byMod).map(([k, v]) => [modName(k), v])))}</tbody></table></div></div>` : ''}
    <div class="card" style="margin-top:16px"><div class="card-h"><h3>Xərc qeydləri (${lines.length})</h3>${mod ? `<button type="button" class="btn sm no-print" data-a="newExpense" data-module="${mod}">+ Xərc</button>` : ''}</div>${lines.length ? `<div class="tw"><table><thead><tr><th>Tarix</th><th>Kateqoriya</th><th>Sahə</th><th>Bölmə</th><th>Qeyd</th><th class="n">Məbləğ</th><th></th></tr></thead><tbody>
    ${lines.map(l => `<tr><td>${fmtD(l.date)}</td><td>${esc(l.cat)}</td><td>${esc(fieldName(l.fieldId))}</td><td>${modName(l.module)}</td><td>${esc(l.note)}${l.kind !== 'expense' ? ` <span class="tag">${esc(l.src)}</span>` : ''}</td><td class="n"><b>${fmt(l.amount)}</b></td>${l.kind === 'expense' ? rowActs('expense', l.ref) : '<td class="acts" style="font-size:12.5px;color:var(--muted)">' + esc(l.src) + ' bölməsindən</td>'}</tr>`).join('')}
    </tbody><tfoot><tr><td colspan="5">Cəmi</td><td class="n">${fmt(total)}</td><td></td></tr></tfoot></table></div>` : '<div class="empty">Seçilən süzgəcə uyğun xərc yoxdur</div>'}</div>`;
  if (mod) return html;
  return { title: 'Xərclər', sub: 'Texnika və işçi xərcləri də buraya avtomatik düşür', actions: `<button type="button" class="btn" data-a="print">🖨 Çap / PDF</button><button type="button" class="btn pri" data-a="newExpense">+ Xərc əlavə et</button>`, body: html };
}

function pageModule(mod) {
  const items = DB.items.filter(i => i.module === mod);
  const inc = sum(incomeLines().filter(l => l.module === mod), l => l.amount), cost = sum(costLines().filter(l => l.module === mod), l => l.amount);
  const tab = VIEW.p.tab || 'stock';
  const tabs = [['stock', 'Mallar və qalıq'], ['sales', 'Satış və gəlir'], ['costs', 'Xərclər']];
  let inner;
  if (tab === 'sales') inner = pageSales(mod);
  else if (tab === 'costs') inner = pageExpenses(mod);
  else inner = `<div class="card"><div class="card-h"><h3>Mallar</h3><button type="button" class="btn sm no-print" data-a="newItem" data-module="${mod}">+ Mal əlavə et</button></div>
    ${items.length ? `<div class="tw"><table><thead><tr><th>Mal</th><th class="n">Qalıq</th><th class="n">Satılıb</th><th class="n">Satış gəliri</th><th></th></tr></thead><tbody>
    ${items.map(i => { const sl = DB.sales.filter(s => s.itemId === i.id); const low = num(i.low) > 0 && stockQty(i.id) <= num(i.low); return `<tr><td><b>${esc(i.name)}</b>${low ? ' <span class="tag debt">Az qalıb</span>' : ''}</td><td class="n"><b>${fmtQ(stockQty(i.id), i.unit)}</b></td><td class="n">${fmtQ(sum(sl, s => num(s.qty)), i.unit)}</td><td class="n">${fmt(sum(sl, s => num(s.total)))}</td><td class="acts no-print"><button type="button" class="btn sm" data-a="go" data-p="stock" data-item="${i.id}">Hərəkətlər</button> <button type="button" class="icon-btn" data-a="edit_item" data-id="${i.id}" aria-label="Düzəliş et">${ICON.edit}</button></td></tr>`; }).join('')}
    </tbody></table></div>` : `<div class="empty">Bu bölmədə mal yoxdur. Məs: ${mod === 'ferma' ? 'Süd, Mal-qara, Yem' : mod === 'findiq' ? 'Fındıq' : 'Dərman adları'}</div>`}</div>`;
  const meta = PAGES_META.find(p => p.id === 'mod_' + mod);
  return {
    title: meta.name, sub: 'Bölmə üzrə qalıq, satış və xərc',
    actions: `<button type="button" class="btn" data-a="newExpense" data-module="${mod}">+ Xərc</button><button type="button" class="btn" data-a="stockIn" data-module="${mod}">↓ Alış / giriş</button><button type="button" class="btn pri" data-a="newSale" data-module="${mod}">+ Satış</button>`,
    body: `<div class="grid g4"><div class="card pad stat"><div class="l">Gəlir (hamısı)</div><div class="v pos">${fmt(inc)}</div></div><div class="card pad stat"><div class="l">Xərc (hamısı)</div><div class="v neg">${fmt(cost)}</div></div><div class="card pad stat dark"><div class="l">Mənfəət</div><div class="v">${fmt(r2(inc - cost))}</div></div></div>
      <div class="seg no-print" style="margin:16px 0" role="tablist">${tabs.map(([id, t]) => `<button type="button" role="tab" aria-selected="${tab === id}" class="${tab === id ? 'on' : ''}" data-a="go" data-p="mod_${mod}" data-tab="${id}">${t}</button>`).join('')}</div>${inner}`
  };
}

function reportRange() {
  const p = VIEW.p, t = todayStr(), preset = p.preset || 'year';
  if (preset === 'month') return { preset, R: { from: t.slice(0, 7) + '-01', to: t }, label: monthLabel() };
  if (preset === 'year') return { preset, R: { from: t.slice(0, 4) + '-01-01', to: t.slice(0, 4) + '-12-31' }, label: t.slice(0, 4) + '-ci il' };
  if (preset === 'all') return { preset, R: null, label: 'Bütün dövr' };
  const from = p.from || t.slice(0, 4) + '-01-01', to = p.to || t;
  return { preset: 'custom', R: { from, to }, label: `${fmtD(from)} – ${fmtD(to)}` };
}
function reportData() {
  const { R, label, preset } = reportRange();
  const inc = incomeLines(R), cost = costLines(R);
  const fieldsRows = DB.fields.map(f => Object.assign({ f }, fieldStats(f.id, R)));
  const genInc = sum(inc.filter(l => !l.fieldId && l.module === 'taxil'), l => l.amount), genCost = sum(cost.filter(l => !l.fieldId && l.module === 'taxil'), l => l.amount);
  const mods = ['taxil', 'ferma', 'findiq', 'derman'].map(m => ({ m, inc: sum(inc.filter(l => l.module === m), l => l.amount), cost: sum(cost.filter(l => l.module === m), l => l.amount) }));
  const cats = {}; cost.forEach(l => cats[l.cat] = r2((cats[l.cat] || 0) + l.amount));
  return { R, label, preset, totInc: sum(inc, l => l.amount), totCost: sum(cost, l => l.amount), fieldsRows, genInc, genCost, mods, cats };
}

  return { title: 'Hesabatlar', sub: D.label, body, actions: `<button type="button" class="btn" data-a="csv">Excel (CSV)</button><button type="button" class="btn pri" data-a="print">PDF / Çap</button>` };

function download(name, content, type) {
  const blob = content instanceof Blob ? content : new Blob([content], { type: type || 'text/plain;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
A.csv = () => {
  const D = reportData(); const q = v => '"' + String(v).replace(/"/g, '""') + '"'; const n = v => String(r2(v)).replace('.', ',');
  const L = [[`${DB.farmName} — hesabat`], ['Dövr', D.label], [], ['Sahə', 'Bitki', 'ha', 'Məhsul', 'Vahid', 'Gəlir', 'Xərc', 'Mənfəət']];
  D.fieldsRows.forEach(r => L.push([r.f.name, r.f.crop ? itemName(r.f.crop) : '', n(r.f.ha), n(r.harvest), r.f.crop ? itemUnit(r.f.crop) : '', n(r.inc), n(r.cost), n(r.profit)]));
  L.push([], ['Bölmə', 'Gəlir', 'Xərc', 'Mənfəət']); D.mods.forEach(x => L.push([modName(x.m), n(x.inc), n(x.cost), n(x.inc - x.cost)]));
  L.push([], ['Xərc kateqoriyası', 'Məbləğ']); Object.entries(D.cats).forEach(([c, v]) => L.push([c, n(v)]));
  L.push([], ['Cəmi gəlir', n(D.totInc)], ['Cəmi xərc', n(D.totCost)], ['Mənfəət', n(D.totInc - D.totCost)]);
  download(`hesabat-${todayStr()}.csv`, '﻿' + L.map(r => r.map(q).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
  toast('Fayl yükləndi');
};

function personLedger(pid) {

    if (s.pay !== 'nisye') ev.push({ date: s.date, ord: 2, desc: `Ödəniş alındı (${PAYTYPES[s.pay]})`, sale: 0, recv: t, buy: 0, paid: 0 });

  DB.expenses.filter(e => e.personId === pid).forEach(e => {
    const t = num(e.amount);
    ev.push({ date: e.date, ord: 1, desc: `Alış: ${e.note || e.cat}`, tag: PAYTYPES[e.pay || 'nagd'], sale: 0, recv: 0, buy: t, paid: 0 });

  arr.push(v); save(); render(); toast('Əlavə olundu');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && MODAL) closeModal(); });
window.addEventListener('storage', e => { if (e.key === KEY) { load(); if (!MODAL) render(); } });

cloudInit();
load();
render();


if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
